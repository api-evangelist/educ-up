aid: educ-up
name: Educ-up
description: 'Educ-up is a French social-impact education group founded in 2016 by Mohamed El Mazzouji,
  headquartered in Saint-Denis, La Réunion with establishments in metropolitan France including Montreuil
  (Seine-Saint-Denis). It operates two consumer- and professional-facing brands rather than a software
  product: Domissori, launched in 2019, which places Montessori-trained educators in family homes for
  childcare, educational workshops and academic tutoring across Vannes, Chambéry, Lyon, Grenoble,
  Perpignan, Montpellier, Marseille and Saint-Denis; and Edacademy, a Qualiopi-certified training and
  apprenticeship centre for early-childhood and personal-care professions (CAP AEPE, Titre Pro ADVF,
  Bac Pro ASSP, parenting and Montessori support). The group also runs Ed''solidaire, a subsidy scheme
  that opens paid childcare to low-income families. Investors include Serena, M Capital, Inco Ventures,
  MakeSense and Racine2. Edacademy delivers its programmes through a self-hosted Moodle learning
  platform at formation.edacademy.fr, but that is an end-user LMS: as of August 2026 Educ-up publishes
  no developer portal, no API documentation and no machine-readable API contract, and its corporate
  domain educ-up.fr now redirects to a parked IONOS default site.'
