  educ-up.fr is therefore a soft-404 catch-all, NOT a document, and none of them earns credit.

  The two hosts that do serve real sites — domissori.fr (WordPress) and www.edacademy.fr
  (Webflow) — return honest 404s on the control path and 404 on every /.well-known/ path.
